<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="我的阅读">
    <meta name="theme-color" content="#f5f1e8">
    <title>我的阅读</title>
    <link rel="manifest" href="manifest.json?v=3">
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
    <!-- ===== 书架视图 ===== -->
    <div id="view-bookshelf" class="view">
        <header class="bookshelf-header">
            <div class="header-row">
                <h1 class="app-title">📖 我的阅读</h1>
                <button class="sort-btn" id="sortBtn" title="排序">⇅</button>
            </div>
        </header>
        <div class="bookshelf-grid" id="bookshelfGrid"></div>
        <div class="empty-state" id="emptyState">
            <div class="empty-icon">📚</div>
            <p class="empty-title">书架空空如也</p>
            <p class="empty-hint">点击右下角 <strong>+</strong> 添加电子书</p>
        </div>
        <button class="fab" id="addBookBtn" title="添加书籍" aria-label="添加书籍">+</button>
        <input type="file" id="fileInput" accept=".epub" style="position:fixed;top:-100px;left:-100px;opacity:0;width:0;height:0;pointer-events:none;">
    </div>

    <!-- ===== 阅读器视图 ===== -->
    <div id="view-reader" class="view hidden" style="background-color: var(--reader-bg, #f5f1e8);">
        <!-- 顶部工具栏 -->
        <div class="reader-topbar" id="readerTopbar">
            <button class="btn-icon" id="btnBack" title="返回书架" aria-label="返回书架">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
            </button>
            <div class="reader-meta">
                <span class="reader-title" id="readerTitle">书名</span>
                <span class="reader-author" id="readerAuthor">作者</span>
            </div>
            <div style="width:24px"></div><!-- 占位保持标题居中 -->
        </div>

        <!-- 阅读内容区 -->
        <div class="reader-viewport" id="readerViewport">
            <div class="reader-content" id="readerContent"></div>
        </div>

        <!-- 底部设置栏 -->
        <div class="reader-bottombar" id="readerBottombar">
            <!-- 进度条 -->
            <div class="reading-progress" id="readingProgress">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <span class="progress-text" id="progressText">0%</span>
            </div>

            <!-- 设置项 -->
            <div class="settings-row">
                <div class="setting-item">
                    <label>背景</label>
                    <div class="color-presets" id="colorPresets">
                        <button data-color="#f5f1e8" class="color-dot active" style="background:#f5f1e8" title="护眼米黄"></button>
                        <button data-color="#ffffff" class="color-dot" style="background:#ffffff;border:1px solid #ddd" title="纯白"></button>
                        <button data-color="#c8e6c9" class="color-dot" style="background:#c8e6c9" title="浅绿"></button>
                        <button data-color="#2d2d2d" class="color-dot" style="background:#2d2d2d" title="深色"></button>
                        <button data-color="#1a1a2e" class="color-dot" style="background:#1a1a2e" title="夜间"></button>
                    </div>
                </div>
                <div class="setting-item">
                    <label>字号</label>
                    <div class="font-size-ctrl">
                        <button class="btn-sm" id="fontSizeDown">A-</button>
                        <span class="size-label" id="fontSizeLabel">16px</span>
                        <button class="btn-sm" id="fontSizeUp">A+</button>
                    </div>
                </div>
                <div class="setting-item">
                    <label>字体</label>
                    <select class="font-select" id="fontFamilySelect">
                        <option value="'PingFang SC','Microsoft YaHei',sans-serif">默认</option>
                        <option value="'Noto Serif SC','Songti SC', 'SimSun', serif">宋体</option>
                        <option value="'PingFang SC','Microsoft YaHei','SimHei',sans-serif">黑体</option>
                        <option value="'KaiTi','STKaiti',serif">楷体</option>
                    </select>
                </div>
            </div>
        </div>

    </div>

    <!-- 重命名弹窗（全局，书架和阅读器都可使用） -->
    <div class="rename-overlay hidden" id="renameOverlay">
        <div class="rename-dialog">
            <h3>修改书名</h3>
            <input type="text" class="rename-input" id="renameInput" placeholder="输入书名">
            <div class="rename-actions">
                <button class="btn-cancel" id="renameCancel">取消</button>
                <button class="btn-confirm" id="renameConfirm">确定</button>
            </div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="js/storage.js?v=3"></script>
    <script src="js/epub.js?v=3"></script>
    <script src="js/bookshelf.js?v=3"></script>
    <script src="js/reader.js?v=3"></script>
    <script src="js/app.js?v=3"></script>
</body>
</html>
